# Oracle AI Database Free. Le mot de passe vient de .env (ORACLE_PWD).
#
# Image par défaut : gvenzl/oracle-free:slim (Docker Hub), la même base Oracle Free
# allégée, l'image de référence pour les tests. Choisie le 16/11/2026 parce que
# l'image officielle (plusieurs Go) ne finissait pas de se télécharger sur ce poste.
# Pour revenir à l'officielle : ORACLE_IMAGE=container-registry.oracle.com/database/free:latest
# Les deux variables de mot de passe sont posées : ORACLE_PWD (officielle),
# ORACLE_PASSWORD (gvenzl). Le PDB s'appelle FREEPDB1 dans les deux.
services:
  oracle:
    image: ${ORACLE_IMAGE:-gvenzl/oracle-free:slim}
    container_name: oracle-free
    ports:
      - "${ORACLE_PORT:-1522}:1521"   # 1521 est pris par les Oracle 19c/21c installés sur le poste
    environment:
      ORACLE_PWD: ${ORACLE_PWD}
      ORACLE_PASSWORD: ${ORACLE_PWD}
    volumes:
      - oradata:/opt/oracle/oradata
    mem_limit: 3g
volumes:
  oradata:
