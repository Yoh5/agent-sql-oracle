# Oracle AI Database Free, image officielle. Le mot de passe vient de .env (ORACLE_PWD).
services:
  oracle:
    image: container-registry.oracle.com/database/free:latest
    container_name: oracle-free
    ports:
      - "1521:1521"
    environment:
      ORACLE_PWD: ${ORACLE_PWD}
    volumes:
      - oradata:/opt/oracle/oradata
    mem_limit: 3g
volumes:
  oradata:
