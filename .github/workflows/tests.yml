name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Tests
        # Sans Oracle ni cle, les tests qui en ont besoin se sautent et disent pourquoi (-rs).
        run: pytest
